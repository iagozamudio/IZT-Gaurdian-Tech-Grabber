<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple, premium web application to grab the latest technology news from The Guardian.">
    <title>Tech News Grabber</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1>Tech News Grabber</h1>
            <button id="refresh-btn" class="refresh-btn">
                <span class="btn-text">Refresh News</span>
                <span class="spinner" id="spinner"></span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <div id="error-container" class="error-container hidden"></div>
        <div id="news-grid" class="news-grid">
            <!-- Articles will be injected here -->
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
