<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple, premium web application to grab the latest technology news from The Guardian.">
    <title>Tech News Grabber</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="header-left">
                <h1>Tech News Grabber</h1>
                <span id="article-count" class="article-count hidden"></span>
            </div>
            <div class="header-right">
                <span id="last-updated" class="last-updated hidden"></span>
                <button id="refresh-btn" class="refresh-btn" title="Refresh news (Press R)">
                    <span class="btn-text">Refresh News</span>
                    <span class="spinner" id="spinner" role="status" aria-label="Loading articles"></span>
                    <kbd class="kbd-hint">R</kbd>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div id="error-container" class="error-container hidden"></div>
        <div id="news-grid" class="news-grid" aria-live="polite" aria-atomic="false">
            <!-- Articles will be injected here -->
        </div>
    </main>

    <!-- Toast notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
